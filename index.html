<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<script>try{if(JSON.parse(localStorage.getItem('engineReunioes.tema'))==='claro'){document.documentElement.dataset.tema='claro';document.querySelector('meta[name=theme-color]').content='#ffffff'}}catch(e){}</script>
<meta name="description" content="Decida se a reunião precisa existir: diagnóstico auditável, duração, custo, convite no Teams/Outlook e boas práticas. Roda 100% no navegador.">
<title>Engine de Reuniões</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300d4aa'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%230a0a0a' stroke-width='3'/%3E%3Cpath d='M10.5 10.5l11 11' stroke='%230a0a0a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    /* ↓ Cor de destaque — único ponto de ajuste da marca. Tons derivados usam color-mix. */
    --accent:#00d4aa;

    --bg:#0a0a0a;
    --surface:#121212;
    --surface-2:#1a1a1a;
    --surface-3:#262626;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --text:#eaeaea;
    --strong:#fafafa;
    --muted:#a1a1a1;
    --subtle:#8a8a8a;

    /* Faixas de resultado (cores de status: sempre acompanhadas de ícone + rótulo) */
    --band-skip:#ff6b6b;
    --band-async:#ffb547;
    --band-meet:var(--acc);

    --accent-soft:color-mix(in srgb,var(--acc) 14%,transparent);
    --accent-line:color-mix(in srgb,var(--acc) 60%,transparent);
    --radius:16px;
    --radius-sm:12px;
    --font:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;
    --font-display:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;
    --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,Menlo,monospace;
    /* Tons que mudam com o tema */
    --acc:var(--accent);          /* destaque usado em texto e controles */
    --on-acc:#0a0a0a;             /* texto/ícone sobre o destaque */
    --on-strong:#0a0a0a;          /* texto sobre botão primário */
    --strong-hover:#ffffff;
    --hover-bg:rgba(255,255,255,.05);
    --line-hover:rgba(255,255,255,.3);
    --tint:rgba(255,255,255,.03);
    --knob:#fafafa;
    --seg-ativo:var(--surface-3);
    --code-text:#d4d4d4;
    --placeholder:#6f6f6f;
    --sombra:0 10px 30px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  /* Tema claro ("White"). O destaque escurece a partir da mesma --accent para manter contraste no branco. */
  :root[data-tema="claro"]{
    --bg:#ffffff;
    --surface:#f7f7f6;
    --surface-2:#efefed;
    --surface-3:#e4e4e1;
    --line:rgba(0,0,0,.09);
    --line-strong:rgba(0,0,0,.18);
    --text:#262626;
    --strong:#0a0a0a;
    --muted:#595959;
    --subtle:#6b6b6b;
    --band-skip:#d6336c;
    --band-async:#b98100;
    --acc:color-mix(in srgb,var(--accent) 60%,#000);
    --on-acc:#ffffff;
    --on-strong:#ffffff;
    --strong-hover:#2b2b2b;
    --hover-bg:rgba(0,0,0,.045);
    --line-hover:rgba(0,0,0,.32);
    --tint:rgba(0,0,0,.025);
    --knob:#ffffff;
    --seg-ativo:#ffffff;
    --code-text:#2b2b2b;
    --placeholder:#767676;
    --sombra:0 10px 30px rgba(0,0,0,.16);
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:border-box}
  *{margin:0;padding:0}
  body{
    min-height:100vh;background:var(--bg);color:var(--text);
    background-image:radial-gradient(70% 480px at 50% -160px,color-mix(in srgb,var(--acc) 10%,transparent),transparent 70%);
    background-repeat:no-repeat;
    font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;
    padding:0 32px;
  }
  .wrap{max-width:1200px;margin:0 auto;padding-block:10px 40px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  [hidden]{display:none!important}
  .sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  h1,h2,h3{font-family:var(--font-display);color:var(--strong);font-weight:650;letter-spacing:-.025em;line-height:1.12}
  .kicker{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .muted{color:var(--muted)}
  .nota{margin-top:10px;font-size:13px;color:var(--muted)}

  /* ---------- topo ---------- */
  .topo{display:flex;align-items:center;gap:28px;padding:10px 0 18px;margin-bottom:28px;border-bottom:1px solid var(--line)}
  .marca{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--strong);white-space:nowrap}
  .marca svg{width:26px;height:26px;flex:none}
  .marca-bg{fill:var(--accent)}
  .nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
  .nav-item{display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;font-size:14px;color:var(--muted);transition:color .15s,background .15s}
  .nav-item:hover{color:var(--text);background:var(--hover-bg)}
  .nav-item[aria-current=page]{color:var(--strong);background:var(--surface-3)}
  .nav-n{margin-left:7px;padding:0 7px;border-radius:999px;background:var(--accent-soft);color:var(--acc);font-family:var(--mono);font-size:11.5px}
  .idioma{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px}
  .idioma button{padding:3px 11px;border-radius:999px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .idioma button[aria-pressed=true]{background:var(--seg-ativo);color:var(--strong);box-shadow:0 1px 2px rgba(0,0,0,.2)}

  /* ---------- botões ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 18px;border-radius:999px;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--strong);color:var(--on-strong)}
  .btn-primary:hover{background:var(--strong-hover)}
  .btn-ghost{border:1px solid var(--line-strong);color:var(--text)}
  .btn-ghost:hover{background:var(--hover-bg);border-color:var(--line-hover)}
  .btn-lg{min-height:48px;padding:12px 24px;font-size:15.5px}
  .btn-sm{min-height:36px;padding:6px 15px;font-size:13.5px}
  .btn[aria-disabled=true]{opacity:.4;pointer-events:none}
  .link{color:var(--muted);font-size:14px;padding:4px 0;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line-strong)}
  .link:hover{color:var(--text)}
  .acoes{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .card .acoes{margin-top:14px}
  .bloco-head{margin-bottom:14px}
  .bloco-head h2{font-size:21px;margin-top:8px}
  .bloco-head p{margin-top:6px;font-size:14px;color:var(--muted)}
  .tela{animation:entra .25s ease}
  @keyframes entra{from{opacity:0;transform:translateY(6px)}}
  .tela-head{margin-bottom:24px}
  .tela-head-linha{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .t-tela{font-size:clamp(30px,3.2vw,40px);letter-spacing:-.035em;margin-top:8px}
  .t-tela:focus{outline:none}
  .tela-head p{margin-top:10px;color:var(--muted);max-width:70ch}
  .voltar{display:inline-flex;font-size:14px;color:var(--muted);padding:4px 0}
  .voltar:hover{color:var(--text)}
  .banner{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:14px 18px;margin-bottom:22px;border-radius:14px;border:1px solid var(--accent-line);background:var(--accent-soft);font-size:14.5px}
  .banner svg{flex:none;width:20px;height:20px;color:var(--acc)}
  .banner-txt{flex:1;min-width:260px}
  .banner-txt p+p{margin-top:4px;color:var(--muted)}

  /* ---------- início ---------- */
  .home-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:end;padding:24px 0 8px}
  .home-hero h1{font-size:clamp(44px,5vw,68px);line-height:1;letter-spacing:-.05em;margin:14px 0 18px}
  .home-hero h1 em{font-style:normal;color:var(--acc)}
  .lead{font-size:17px;color:var(--muted);max-width:52ch}
  .home-hero .acoes{margin-top:26px}
  .fatos{display:grid;gap:10px}
  .fato{padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
  .fato .kicker{color:var(--acc)}
  .fato p{margin-top:6px;font-size:14px;color:var(--muted)}
  .ferramentas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:44px}
  .ferr{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:border-color .15s,background .15s,transform .15s}
  .ferr:hover{border-color:var(--accent-line);background:var(--surface-2);transform:translateY(-2px)}
  .ferr-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--acc)}
  .ferr-ic svg{width:20px;height:20px}
  .ferr h2{font-size:18.5px;margin:14px 0 8px}
  .ferr p{flex:1;font-size:14px;color:var(--muted)}
  .ferr .meta{margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
  .home-barra{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:-6px}
  .tema-toggle{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
  .tema-toggle button{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;font-size:13px;color:var(--muted);transition:color .15s,background .15s}
  .tema-toggle button svg{width:15px;height:15px}
  .tema-toggle button:hover{color:var(--text)}
  .tema-toggle button[aria-pressed=true]{background:var(--seg-ativo);color:var(--strong);box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .links-home{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:22px}

  /* ---------- formulários ---------- */
  .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"obj info" "obj disc" "total contrib" "urg rec" "abs rec";gap:14px}
  #q-objetivo{grid-area:obj} #q-info{grid-area:info} #q-discordancia{grid-area:disc} #q-total{grid-area:total}
  #q-contribuem{grid-area:contrib} #q-urgencia{grid-area:urg} #q-recorrente{grid-area:rec} #q-abstracao{grid-area:abs}
  .q{padding:18px 18px 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
  .q fieldset{border:0;min-width:0}
  .q legend,.q .q-leg{display:block;width:100%;margin-bottom:12px;font-weight:600;font-size:15.5px;line-height:1.35;color:var(--strong)}
  .q-n{margin-right:10px;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--acc)}
  .q-ajuda{margin:-6px 0 12px;font-size:13px;color:var(--muted)}
  .q.falta{border-color:color-mix(in srgb,var(--band-skip) 55%,transparent)}
  .q.falta .q-leg::after,.q.falta legend::after{content:"  · " attr(data-falta);color:var(--band-skip);font-weight:500;font-size:12.5px}
  .tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--acc);font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}
  .chips{display:grid;gap:8px}
  .c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .c1{grid-template-columns:1fr}
  .c2>.chip:last-child:nth-child(odd){grid-column:1/-1}
  .chip{position:relative;display:flex}
  .chip input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  .chip-ui{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);font-size:14.5px;line-height:1.3;cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
  .chip-ui::before{content:"";flex:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-strong);transition:border-color .15s,background .15s,box-shadow .15s}
  .chip-ui:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .chip input:checked+.chip-ui{border-color:var(--accent-line);background:var(--accent-soft);color:var(--strong)}
  .chip input:checked+.chip-ui::before{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 3px var(--bg)}
  .chip input:focus-visible+.chip-ui{outline:2px solid var(--acc);outline-offset:2px}
  .sub{margin-top:14px;padding:14px;border:1px dashed var(--line-strong);border-radius:var(--radius-sm)}
  .sub-q{margin-bottom:10px;font-size:14.5px;font-weight:600;color:var(--strong)}
  .num-linha{display:flex;align-items:center;gap:12px}
  .stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);overflow:hidden}
  .st-btn{width:42px;min-height:42px;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--muted);transition:background .15s,color .15s}
  .st-btn:hover{color:var(--text);background:var(--surface-2)}
  .st-btn:focus-visible{outline-offset:-2px}
  .stepper input{width:64px;background:transparent;border:0;border-inline:1px solid var(--line);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper input:focus{outline:none;background:var(--surface-2)}
  .stepper input::placeholder{color:var(--subtle)}
  .st-sm .st-btn{width:32px;min-height:36px;font-size:17px}
  .st-sm input{width:40px;font-size:15px}
  .st-un{color:var(--muted);font-size:14px}
  .prop{margin-top:14px}
  .prop-txt{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--muted)}
  .prop-txt b{color:var(--text);font-weight:600}
  .prop-trilho{height:6px;border-radius:3px;background:color-mix(in srgb,var(--prop-cor,var(--acc)) 20%,transparent);overflow:hidden}
  .prop-fill{height:100%;border-radius:3px;background:var(--prop-cor,var(--acc));transition:width .3s ease}
  .modelos{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:18px}
  .modelos .kicker{margin-right:4px}
  .modelo-btn{padding:6px 14px;border:1px solid var(--line-strong);border-radius:999px;font-size:13.5px;color:var(--text);transition:border-color .15s,background .15s}
  .modelo-btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
  .modelos .nota{margin:0 0 0 6px}
  .barra-envio{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:22px;margin-top:6px;padding:20px 0 16px;background:linear-gradient(to top,var(--bg) 68%,transparent)}
  .progresso{width:210px;flex:none}
  .prog-txt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .prog-trilho{height:4px;margin-top:6px;border-radius:2px;background:var(--surface-3);overflow:hidden}
  .prog-fill{height:100%;width:0;border-radius:2px;background:var(--acc);transition:width .25s ease}
  .previa{display:inline-flex;align-items:center;gap:12px}
  .atalho{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--subtle)}
  .aviso-ia{display:flex;gap:12px;padding:14px 16px;margin-bottom:18px;border-radius:var(--radius-sm);border:1px solid var(--accent-line);background:var(--accent-soft);font-size:14px}
  .aviso-ia svg{flex:none;width:20px;height:20px;margin-top:1px;color:var(--acc)}
  .aviso-ia p+p{margin-top:5px;color:var(--muted)}
  textarea{display:block;width:100%;min-height:92px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);font-size:14.5px;line-height:1.5;resize:vertical;transition:border-color .15s,box-shadow .15s}
  textarea::placeholder,input::placeholder{color:var(--placeholder)}
  textarea:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  .rot{display:block;margin:16px 0 8px;font-size:14px;font-weight:500}
  .campos-ms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:4px}
  .campo{display:grid;gap:6px;font-size:13px;color:var(--muted)}
  .campo-largo{grid-column:1/-1}
  .inp,.campo input,.campo select{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14.5px;color:var(--text)}
  .inp:focus,.campo input:focus,.campo select:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  select.inp,.campo select{padding-right:8px}
  .separador{height:1px;margin:22px 0 18px;background:var(--line)}
  .sub-titulo{margin-bottom:12px;font-size:16px}
  details.previa-txt{margin-top:12px}
  details.previa-txt summary{cursor:pointer;padding:4px 0;font-size:13.5px;color:var(--muted)}
  details.previa-txt summary:hover{color:var(--text)}
  pre.bloco-txt{max-height:340px;overflow:auto;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--code-text)}
  .erro{margin-top:10px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--band-skip) 50%,transparent);border-radius:10px;background:color-mix(in srgb,var(--band-skip) 10%,transparent);font-size:14px;color:var(--strong)}

  /* ---------- pré-preenchimento ---------- */
  .passos{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
  .passo{display:grid;gap:12px}
  .passo-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-family:var(--mono);font-size:13px;color:var(--acc)}
  .passo-t{display:block;font-weight:600;color:var(--strong)}
  .passo textarea{min-height:170px}

  /* ---------- resultado ---------- */
  .veredito{--band:var(--band-meet);padding:26px 28px;border-radius:20px;border:1px solid color-mix(in srgb,var(--band) 32%,var(--line));background:radial-gradient(90% 120% at 0% 0%,color-mix(in srgb,var(--band) 16%,transparent),transparent 55%),var(--surface)}
  .v-skip{--band:var(--band-skip)} .v-async{--band:var(--band-async)} .v-meet{--band:var(--band-meet)}
  .v-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:start}
  .v-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pill{--band:var(--band-meet);display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--hover-bg);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
  .pill svg{flex:none;width:16px;height:16px;color:var(--band)}
  .pill.skip{--band:var(--band-skip)} .pill.async{--band:var(--band-async)} .pill.meet{--band:var(--band-meet)}
  .v-score{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .v-score b{font-size:15px;font-weight:600;color:var(--strong)}
  .v-titulo{margin-top:16px;font-size:clamp(32px,3.4vw,44px);letter-spacing:-.045em}
  .v-titulo:focus{outline:none}
  .v-sub{margin-top:10px;font-size:16px;color:var(--muted);max-width:56ch}
  .v-lado{display:grid;gap:22px}
  .v-destaque{padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--tint)}

  /* ---------- calculadora ---------- */

  .t-sub{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .anual-nota{grid-column:1/-1;padding:0 16px 12px;background:var(--surface);font-size:12.5px;color:var(--muted)}
  .calc-pe{display:flex;flex-wrap:wrap;gap:8px;padding:18px 22px 22px}
  .calc-corpo{display:grid;gap:20px;padding:20px 22px 22px}
  .campo-rot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;font-size:14px;font-weight:500}
  .campo-rot output{font-family:var(--mono);color:var(--strong)}
  .campo-rot select{height:30px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
  input[type=range]{--p:25%;display:block;width:100%;height:26px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--acc) var(--p),var(--surface-3) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--knob);box-shadow:0 0 0 1px var(--line-strong),0 1px 3px rgba(0,0,0,.35)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--surface-3)}
  input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--acc)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--knob);box-shadow:0 0 0 1px var(--line-strong),0 1px 3px rgba(0,0,0,.35)}
  .presets{display:flex;gap:6px;margin-top:10px}

  .preset:hover{border-color:var(--line-strong);color:var(--text)}

  .seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}

  .moeda input::-webkit-outer-spin-button,.moeda input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .moeda:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  .dica-taxa{flex-basis:100%;font-size:12.5px;color:var(--muted)}
  .nivel{display:grid;grid-template-columns:minmax(0,1fr) auto auto 32px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .nivel:first-child{border-top:0;padding-top:0}
  .n-nome{min-width:0;height:40px;margin-left:-10px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:transparent;font-size:14.5px;font-weight:500}

  .nivel .moeda input{width:52px;font-size:14.5px}
  .n-rm{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;line-height:1;color:var(--subtle)}

  .niveis-pe{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
  .recorr{display:grid;gap:12px}
  .switch{position:relative;display:inline-flex;align-items:center;gap:12px;width:max-content;font-size:14.5px;font-weight:500;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:1px;height:1px}
  .sw{position:relative;flex:none;width:42px;height:24px;border-radius:999px;background:var(--surface-3);transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
  .switch input:checked+.sw{background:var(--acc)}
  .switch input:checked+.sw::after{transform:translateX(18px);background:var(--on-acc)}
  .switch input:focus-visible+.sw{outline:2px solid var(--acc);outline-offset:2px}
  .freqs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

  /* ---------- checklist ---------- */
  .check-lista{display:grid;gap:8px}

  .check:hover{border-color:var(--line-strong)}
  .check input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
  .check input:checked{background:var(--acc);border-color:var(--acc)}
  .check input:checked::after{content:"";width:10px;height:5px;border:2px solid var(--on-acc);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
  .gatilho{display:inline-block;margin-bottom:3px;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--subtle)}
  .check b{display:block;font-weight:600;font-size:15px;line-height:1.35;color:var(--strong)}
  .check .x{display:block;margin-top:3px;font-size:13.5px;color:var(--muted)}
  .check:has(input:checked) b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--subtle)}
  .check-cont{margin-top:10px;font-size:13px;color:var(--muted)}

  /* ---------- tabelas, KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .kpi .t-val{font-size:28px;letter-spacing:-.03em}
  .tabela-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
  .tabela{width:100%;border-collapse:collapse;font-size:14px}
  .tabela th{padding:12px;text-align:left;vertical-align:bottom;font-family:var(--mono);font-size:11px;font-weight:500;line-height:1.35;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  .tabela td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tabela select.inp[data-c=freq]{min-width:118px}
  .tabela select.inp[data-c=pauta]{min-width:158px}
  .tabela .n-rm{display:inline-grid;vertical-align:middle}
  .tabela tbody tr:last-child td{border-bottom:0}
  .tabela .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tabela th.num{white-space:normal}
  .tabela tfoot td{padding:12px;border-top:1px solid var(--line-strong);border-bottom:0;font-weight:600;color:var(--strong)}

  .tabela .inp-num{width:68px;text-align:right}
  .tabela .inp-nome{min-width:170px}
  .barra-rel{display:block;height:4px;margin:5px 0 0 auto;border-radius:2px;background:var(--acc)}
  .tabela .acoes-linha{white-space:nowrap;text-align:right}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 14px}
  .toolbar .dir{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  .tog{display:inline-flex;gap:4px}
  .tog button{min-height:30px;padding:2px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted)}
  .tog button:hover{border-color:var(--line-strong);color:var(--text)}
  .tog button[aria-pressed=true]{border-color:var(--line-strong);background:var(--surface-3);color:var(--strong)}
  .retro{margin:18px 0 0;font-size:16px}
  .retro b{color:var(--strong)}
  .calib{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:24px;align-items:start;margin-top:14px}
  .matriz{border-collapse:collapse;font-size:13.5px}

  .matriz th{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .matriz td.diag{color:var(--muted)}
  .matriz td.fora{color:var(--strong);font-weight:600;background:color-mix(in srgb,var(--band-async) 10%,transparent)}
  .limpar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:24px;font-size:14px;color:var(--muted)}
  .vazio{padding:40px 20px;text-align:center}
  .vazio p{margin-bottom:18px;color:var(--muted)}

  /* ---------- convidado ---------- */
  .conv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .conv-form{display:grid;gap:14px}
  .conv-res{position:sticky;top:16px;display:grid;gap:16px}
  .prep{list-style:none;display:grid;gap:8px;margin-top:6px}
  .prep li{position:relative;padding-left:22px;font-size:14px}
  .prep li::before{content:"";position:absolute;left:4px;top:8px;width:8px;height:8px;border-radius:2px;background:var(--acc)}

  .toast{position:fixed;left:50%;bottom:28px;z-index:50;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;background:var(--strong);color:var(--on-strong);font-size:14px;font-weight:600;box-shadow:var(--sombra);opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .2s,transform .2s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .rodape{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--subtle)}

  /* Janelas estreitas (notebook com painel lateral, tela dividida) */
  @media (max-width:1000px){
    body{padding:0 20px}
    .home-hero,.v-grid,.res-grid,.conv-grid,.calib{grid-template-columns:minmax(0,1fr)}
    .ferramentas,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

    .form-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:none}
    .form-grid>.q{grid-area:auto!important}
    .conv-res{position:static}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>

<script>
'use strict';

/* =====================================================================
   ENGINE — regras puras, sem DOM. Determinístico e auditável.
   Os textos vêm do dicionário do idioma ativo (T); os pesos, daqui.
   ===================================================================== */
/* ENGINE:START */
const LIMIAR_MUITOS = 6;    // acima disso: dica de papéis + leitura silenciosa
const CORTE_ASYNC = 35;     // score >= 35 → assíncrono primeiro
const CORTE_REUNIAO = 60;   // score >= 60 → reunião justificada

/* Peso-base de cada objetivo.
   pesoInfo: quanto "informação não documentada" pesa (1 = cheio, .5 = metade, 0 = não se aplica).
   discNenhuma: pontos quando não há discordância (só pesa onde divergência é o motivo da reunião). */
const PESOS = {
  decisao:      {base:55, pesoInfo:1,  discNenhuma:-10},
  discordancia: {base:65, pesoInfo:1,  discNenhuma:-10},
  informar:     {base:15, pesoInfo:1,  discNenhuma:-10},
  input:        {base:35, pesoInfo:.5, discNenhuma:-10},
  brainstorm:   {base:65, pesoInfo:.5, discNenhuma:0},
  treinamento:  {base:60, pesoInfo:1,  discNenhuma:0},
  social:       {base:65, pesoInfo:0,  discNenhuma:0},
};
const VALORES = {
  objetivo:     Object.keys(PESOS),
  info:         ['sim', 'parcial', 'nao'],
  discordancia: ['nenhuma', 'baixa', 'alta'],
  urgencia:     ['48h', '24h', 'critico'],
  recorrente:   ['nao', 'sim'],
  pautaNova:    ['sim', 'nao'],
  abstracao:    ['concreto', 'abstrato'],
};
const OCORRENCIAS = {diaria:250, semanal:52, quinzenal:26, mensal:12};   // por ano (diária = dias úteis)
const FRACAO_PAUTA = {sempre:1, maioria:.75, metade:.5, raro:.25};       // auditoria: ocorrências que têm pauta de verdade
const MOEDAS = ['BRL', 'USD', 'EUR'];
const ORDEM_FAIXA = {skip:0, async:1, meet:2};

/* Modelos rápidos: respostas típicas, sempre revisadas antes de pontuar. */
const MODELOS = {
  status:      {objetivo:'informar', info:'sim', discordancia:'nenhuma', urgencia:'48h', recorrente:'sim', abstracao:'concreto'},
  umaum:       {objetivo:'social', info:'sim', discordancia:'nenhuma', total:2, contribuem:2, urgencia:'48h', recorrente:'sim', abstracao:'concreto'},
  comite:      {objetivo:'decisao', info:'sim', discordancia:'baixa', urgencia:'24h', recorrente:'nao', abstracao:'abstrato'},
  workshop:    {objetivo:'brainstorm', info:'parcial', discordancia:'baixa', urgencia:'48h', recorrente:'nao', abstracao:'abstrato'},
  conflito:    {objetivo:'discordancia', info:'parcial', discordancia:'alta', urgencia:'24h', recorrente:'nao', abstracao:'concreto'},
  treinamento: {objetivo:'treinamento', info:'sim', discordancia:'nenhuma', urgencia:'48h', recorrente:'nao', abstracao:'concreto'},
};

/* Modo convidado ("preciso ir?") */
const CONVITE = {
  papel:      ['decido', 'contribuo', 'afetado', 'acompanho', 'naosei'],
  pauta:      ['clara', 'vaga', 'sem'],
  rep:        ['sim', 'nao'],
  registro:   ['sim', 'naosei', 'nao'],
  prioridade: ['nao', 'sim'],
};
const GRUPO_SAIDA = {ir:'meet', papel:'async', pauta:'async', parcial:'async', escrito:'skip', delegar:'skip', ata:'skip'};

let T = null;   // dicionário do idioma ativo (definido por definirIdioma)
function rotulo(campo, v){ return (T.opcoes[campo] && T.opcoes[campo][v]) || String(v); }

function faixaDoScore(s){ return s >= CORTE_REUNIAO ? 'meet' : s >= CORTE_ASYNC ? 'async' : 'skip'; }

function camposFaltando(r){
  const f = [];
  ['objetivo', 'info', 'discordancia'].forEach(k => { if (!VALORES[k].includes(r[k])) f.push(k); });
  if (!(r.total >= 2)) f.push('total');
  if (!(r.contribuem >= 1)) f.push('contribuem');
  if (!VALORES.urgencia.includes(r.urgencia)) f.push('urgencia');
  if (!VALORES.recorrente.includes(r.recorrente) || (r.recorrente === 'sim' && !VALORES.pautaNova.includes(r.pautaNova))) f.push('recorrente');
  if (!VALORES.abstracao.includes(r.abstracao)) f.push('abstracao');
  return f;
}

/* r = {objetivo, info, discordancia, total, contribuem, urgencia, recorrente, pautaNova, abstracao} */
function avaliar(r){
  const o = PESOS[r.objetivo], N = T.notas, Fa = T.fatores;
  const curto = T.opcoes.objetivoCurto[r.objetivo];
  const linhas = [];
  const add = (fator, escolha, pts, nota, rotPts) => linhas.push({fator, escolha, pts, nota, rotPts});

  // 1. Objetivo → peso-base
  add(Fa.objetivo, rotulo('objetivo', r.objetivo), o.base, N.base);

  // 2. Informação documentada
  const escInfo = rotulo('info', r.info);
  if (o.pesoInfo === 0) add(Fa.info, escInfo, 0, N.infoSocial);
  else if (r.objetivo === 'informar' && r.info === 'sim') add(Fa.info, escInfo, -10, N.infoLink);
  else {
    const pts = Math.round({sim:0, parcial:-8, nao:-20}[r.info] * o.pesoInfo) || 0;
    add(Fa.info, escInfo, pts, N.info[r.info] + (o.pesoInfo < 1 && pts ? N.pesoReduzido(curto) : ''));
  }

  // 3. Discordância
  const escDisc = rotulo('discordancia', r.discordancia);
  if (r.discordancia === 'alta') add(Fa.disc, escDisc, 25, N.discAlta);
  else if (r.discordancia === 'baixa') add(Fa.disc, escDisc, 0, N.discBaixa);
  else add(Fa.disc, escDisc, o.discNenhuma, o.discNenhuma ? N.discNenhuma : N.naoPesa(curto));

  // 4 + 5. Proporção de quem contribui — o sinal mais forte de reunião inflada
  const ouvintes = r.total - r.contribuem;
  const ratio = r.contribuem / r.total;
  const escProp = N.propEsc(r.contribuem, r.total, Math.round(ratio * 100));
  if (ratio >= .75)     add(Fa.prop, escProp, 5, N.propAlta);
  else if (ratio >= .5) add(Fa.prop, escProp, 0, N.propMedia);
  else if (ratio >= .3) add(Fa.prop, escProp, -10, N.propBaixa(ouvintes));
  else                  add(Fa.prop, escProp, -20, N.propMuitoBaixa(ouvintes, r.total));

  // 6. Urgência
  const escUrg = rotulo('urgencia', r.urgencia);
  if (r.urgencia === '48h') add(Fa.urg, escUrg, -5, N.urg48);
  else if (r.urgencia === '24h') add(Fa.urg, escUrg, 5, N.urg24);
  else add(Fa.urg, escUrg, 15, N.urgCrit);

  // 7. Recorrência
  const semPauta = r.recorrente === 'sim' && r.pautaNova === 'nao';
  if (r.recorrente !== 'sim') add(Fa.rec, N.recPontual, 0, N.recPontualNota);
  else if (!semPauta) add(Fa.rec, N.recComPauta, 0, N.recComPautaNota);
  else add(Fa.rec, N.recSemPauta, null, N.recSemPautaNota, N.zera);

  // 8. Abstração — não pontua, só alimenta as dicas
  add(Fa.tema, rotulo('abstracao', r.abstracao), null, N.temaNota, '—');

  const bruto = linhas.reduce((s, l) => s + (l.pts || 0), 0);
  let score = Math.max(0, Math.min(100, bruto));
  const faixaScore = faixaDoScore(score);
  let faixa = faixaScore;
  const flags = {inflada: ratio < .5 && r.total > 3, infoPendente: r.info === 'nao' && o.pesoInfo === 1};
  if (semPauta){
    score = 0; faixa = 'skip'; flags.recorrenteSemPauta = true;
  } else {
    if (flags.infoPendente && faixa === 'meet'){ faixa = 'async'; flags.prematura = true; }
    if (r.urgencia === 'critico' && faixa !== 'meet'){ flags.excecaoUrgencia = true; flags.faixaSemExcecao = faixa; faixa = 'meet'; }
  }
  const res = {score, bruto, linhas, faixa, faixaScore: semPauta ? 'skip' : faixaScore, flags, ratio};
  res.duracao = sugerirDuracao(r, flags, r.total);
  // Call de desempate (faixa assíncrona): só quem diverge, nunca mais que 30 min.
  const call = sugerirDuracao(r, flags, r.contribuem);
  res.duracaoCall = {...call, min:Math.min(call.min, 30)};
  return res;
}

/* Duração: nunca 60 min por padrão — só quando o formato (workshop/brainstorm) justifica. */
function sugerirDuracao(r, flags, pessoas){
  const D = T.duracao, n = pessoas;
  if (flags.excecaoUrgencia) return {min:15, motivo:D.excecao};
  switch (r.objetivo){
    case 'brainstorm':  return n <= 3 ? {min:45, motivo:D.brainPequeno} : {min:60, motivo:D.brain};
    case 'treinamento': return {min:45, motivo:D.treino};
    case 'social':      return {min:30, motivo: n <= 2 ? D.umaum : D.ritual};
    case 'informar':    return {min:15, motivo:D.informar};
  }
  const alvo = r.objetivo === 'input' ? D.alvoInput : D.alvoDecisao;
  let min, motivo;
  if (n <= 3){ min = 15; motivo = D.pequeno(alvo); }
  else if (n <= 6){ min = 30; motivo = D.medio(alvo); }
  else { min = 45; motivo = D.grande(n); }
  if (r.discordancia === 'alta' && min < 45){ min += 15; motivo += D.discAlta; }
  return {min, motivo};
}

/* Módulo 3 — dicas disparadas pelas respostas (não é lista fixa). */
function gerarDicas(r, res){
  const c = {total:r.total, ouvintes:r.total - r.contribuem};
  const ids = [];
  if (res.flags.excecaoUrgencia) ids.push('timebox');
  if (r.abstracao === 'abstrato') ids.push('visual');
  if (r.objetivo === 'decisao' || r.objetivo === 'discordancia') ids.push('proposta');
  if (res.flags.infoPendente) ids.push('dados');
  if (r.total > LIMIAR_MUITOS) ids.push('papeis');
  if (res.flags.inflada) ids.push('inflada');
  if (r.recorrente === 'sim') ids.push('sempauta');
  if (r.objetivo === 'brainstorm') ids.push('brainwriting');
  if (r.discordancia === 'alta' || r.objetivo === 'discordancia') ids.push('ata');
  ids.push('nextsteps');
  return ids.map(id => ({id, ...T.dicas[id](c)}));
}

/* Esqueleto de pauta com tempos que somam exatamente a duração. */
function esqueletoPauta(r, res, dur){
  const B = T.blocos, blocos = [];
  const add = (min, t) => { if (min > 0) blocos.push({min, t}); };
  const abre = dur <= 15 ? 2 : 3, fecha = dur <= 15 ? 3 : 5;
  let resto = dur - abre - fecha;
  add(abre, B.abertura);
  if (r.total > LIMIAR_MUITOS && dur >= 30){ add(5, B.leitura); resto -= 5; }
  if (res.flags.excecaoUrgencia) add(resto, B.excecao);
  else switch (r.objetivo){
    case 'decisao': add(resto, B.decisao); break;
    case 'discordancia': { const a = Math.round(resto * .4); add(a, B.discA); add(resto - a, B.discB); break; }
    case 'informar': add(resto, B.informar); break;
    case 'input': add(resto, B.input); break;
    case 'brainstorm': { const a = Math.round(resto * .3), b = Math.round(resto * .4); add(a, B.brainA); add(b, B.brainB); add(resto - a - b, B.brainC); break; }
    case 'treinamento': { const a = Math.round(resto * .7); add(a, B.treinoA); add(resto - a, B.treinoB); break; }
    case 'social': add(resto, r.total <= 2 ? B.socialDois : B.socialEquipe); break;
  }
  add(fecha, B.next);
  let t = 0;
  return blocos.map(b => ({ini:t, fim:(t += b.min), t:b.t}));
}

function dadosResumo(r, res){
  return {
    objetivo: rotulo('objetivo', r.objetivo), total:r.total, contribuem:r.contribuem, ouvintes:r.total - r.contribuem,
    info: rotulo('info', r.info), disc: rotulo('discordancia', r.discordancia), urg: rotulo('urgencia', r.urgencia),
    recorrente: r.recorrente === 'sim', pautaNova: r.pautaNova === 'sim', tema: rotulo('abstracao', r.abstracao),
    faixa: T.faixas[res.faixa].rotulo, score: res.score,
  };
}
function modeloMensagem(r, res){
  return T.modeloMensagem({semPauta:!!res.flags.recorrenteSemPauta, objetivo:r.objetivo, prazo:T.prazo[r.urgencia], async:res.faixa === 'async', callMin:res.duracaoCall.min});
}
function promptMensagem(r, res, ctx){
  return T.promptMensagem({resumo:T.resumo(dadosResumo(r, res)), ctx:String(ctx || '').trim(), prazo:T.prazo[r.urgencia],
    async:res.faixa === 'async', callMin:res.duracaoCall.min, semPauta:!!res.flags.recorrenteSemPauta});
}
function promptPauta(r, res, dur, ctx){
  return T.promptPauta({resumo:T.resumo(dadosResumo(r, res)), ctx:String(ctx || '').trim(), dur,
    pauta: esqueletoPauta(r, res, dur).map(b => `- ${b.ini}–${b.fim} min: ${b.t}`).join('\n'),
    extras: gerarDicas(r, res).filter(d => d.p).map(d => `- ${d.p}`)});
}
function promptPrefill(texto){ return T.promptPrefill(String(texto || '').trim()); }

/* Lê a resposta colada do assistente: JSON (tolerante a cercas ``` e vírgulas sobrando) ou linhas "chave: valor".
   Aceita rótulos em português ou inglês. */
const CHAVES_IA = {
  objetivo:['objetivo', 'goal'], info:['info_documentada', 'informacao_documentada', 'info'], discordancia:['discordancia', 'disagreement'],
  total:['participantes_total', 'total'], contribuem:['participantes_contribuem', 'contribuem'], urgencia:['urgencia', 'urgency'],
  recorrente:['recorrente', 'recurring'], pautaNova:['pauta_nova', 'pautanova'], abstracao:['abstracao'],
};
const SINONIMOS = {sim:'sim', yes:'sim', true:'sim', s:'sim', y:'sim', nao:'nao', no:'nao', false:'nao', n:'nao', partial:'parcial', partly:'parcial', none:'nenhuma', low:'baixa', high:'alta'};
function normTxt(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
function casarOpcao(campo, bruto){
  if (typeof bruto === 'boolean') bruto = bruto ? 'sim' : 'nao';
  let v = normTxt(bruto);
  if (SINONIMOS[v]) v = SINONIMOS[v];
  const ops = VALORES[campo].map(val => [val, ...Object.values(I18N).map(d => normTxt(d.opcoes[campo][val]))]);
  const exato = ops.find(o => o.includes(v));
  if (exato) return exato[0];
  const sem = x => x.replace(/\s+/g, '');
  const pre = sem(v).slice(0, 3);
  if (pre.length < 2) return null;
  const cands = ops.filter(o => o.some(x => sem(x).startsWith(pre)));
  return cands.length === 1 ? cands[0][0] : null;
}
function parseRespostaIA(txt){
  const t = String(txt || '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  let obj = null;
  const ini = t.indexOf('{'), fim = t.lastIndexOf('}');
  if (ini >= 0 && fim > ini){
    const bloco = t.slice(ini, fim + 1);
    try { obj = JSON.parse(bloco); }
    catch (e){ try { obj = JSON.parse(bloco.replace(/,\s*([}\]])/g, '$1')); } catch (e2){ obj = null; } }
  }
  if (!obj || typeof obj !== 'object'){
    obj = {};
    t.split(/\r?\n/).forEach(l => {
      const m = l.match(/^\s*[-*•]?\s*["']?([\p{L}_ ]+?)["']?\s*[:=]\s*["']?([^"'\n]*?)["']?\s*,?\s*$/u);
      if (m) obj[m[1]] = m[2];
    });
  }
  const plano = {};
  for (const [k, v] of Object.entries(obj)) plano[normTxt(k).replace(/\s+/g, '_')] = v;
  const valores = {}, invalidos = [];
  for (const [campo, aliases] of Object.entries(CHAVES_IA)){
    const chave = aliases.find(a => a in plano);
    if (!chave) continue;
    const bruto = plano[chave];
    if (bruto === null || bruto === undefined || String(bruto).trim() === '' || normTxt(bruto) === 'null') continue;
    if (campo === 'total' || campo === 'contribuem'){
      const n = parseInt(String(bruto).replace(/\D+/g, ''), 10);
      if (Number.isFinite(n) && n > 0) valores[campo] = n; else invalidos.push(campo);
      continue;
    }
    const v = casarOpcao(campo, bruto);
    if (v) valores[campo] = v; else invalidos.push(campo);
  }
  if (valores.total) valores.total = Math.max(2, Math.min(300, valores.total));
  if (valores.contribuem) valores.contribuem = Math.max(1, Math.min(valores.total || 300, valores.contribuem));
  if (valores.recorrente === 'nao') delete valores.pautaNova;
  const obs = plano.observacao || plano.observacoes || '';
  return {valores, invalidos, observacao: typeof obs === 'string' ? obs.trim().slice(0, 300) : ''};
}

/* ---------- modo convidado ---------- */
function avaliarConvite(g){
  let saida, usados;
  // Sem saber o próprio papel, o primeiro passo é perguntar — a pauta só entra se também estiver faltando.
  if (g.papel === 'naosei'){ saida = 'papel'; usados = g.pauta === 'clara' ? ['papel'] : ['papel', 'pauta']; }
  else if (g.papel === 'acompanho'){ saida = 'ata'; usados = ['papel', 'registro']; }
  else if (g.pauta === 'sem'){ saida = 'pauta'; usados = ['papel', 'pauta']; }
  else if (g.papel === 'decido'){ saida = 'ir'; usados = ['papel', 'pauta']; }
  else if (g.papel === 'contribuo'){ saida = g.prioridade === 'sim' ? 'escrito' : 'parcial'; usados = ['papel', 'pauta', 'prioridade']; }
  else if (g.rep === 'sim'){ saida = 'delegar'; usados = ['papel', 'pauta', 'rep']; }
  else { saida = g.prioridade === 'sim' ? 'escrito' : 'ir'; usados = ['papel', 'pauta', 'rep', 'prioridade']; }
  const E = T.conv.efeitos;
  const nota = {
    papel: E[g.papel],
    pauta: g.pauta === 'sem' ? E.semPauta : g.pauta === 'vaga' ? E.vaga : E.clara,
    rep: g.rep === 'sim' ? E.repSim : E.repNao,
    registro: g.registro === 'sim' ? E.regSim : g.registro === 'naosei' ? E.regNaoSei : E.regNao,
    prioridade: g.prioridade === 'sim' ? E.priSim : E.priNao,
  };
  const razoes = Object.keys(CONVITE).map(k => ({campo:k, fator:T.conv.perguntasCurtas[k], escolha:T.conv.op[k][g[k]], nota:nota[k], usado:usados.includes(k)}));
  return {saida, grupo:GRUPO_SAIDA[saida], razoes};
}
function conviteFaltando(g){ return Object.keys(CONVITE).filter(k => !CONVITE[k].includes(g[k])); }

/* ---------- auditoria de recorrentes ---------- */
function calcularAuditoria(linhas, taxa){
  const itens = linhas.map(l => {
    const pessoas = Math.max(0, +l.pessoas || 0), dur = Math.max(0, +l.duracao || 0);
    const oc = OCORRENCIAS[l.freq] || 52;
    const custoOc = pessoas * taxa * dur / 60;
    const custoAno = custoOc * oc;
    const corte = dur <= 0 ? 0 : dur < 60 ? 5 : 10;   // Outlook: "Terminar compromissos mais cedo"
    return {...l, custoOc, custoAno, horasAno: pessoas * dur / 60 * oc,
      economia: custoAno * (1 - (FRACAO_PAUTA[l.pauta] ?? 1)),
      speedy: pessoas * taxa * Math.min(corte, dur) / 60 * oc};
  });
  const soma = k => itens.reduce((s, i) => s + i[k], 0);
  return {itens, total:soma('custoAno'), horas:soma('horasAno'), economia:soma('economia'), speedy:soma('speedy')};
}
const PREFIXOS_FREQ = {diaria:['dia', 'dai'], semanal:['sem', 'wee'], quinzenal:['qui', 'biw', 'for'], mensal:['men', 'mon']};
const PREFIXOS_PAUTA = {sempre:['sem', 'alw'], maioria:['qua', 'alm', 'mos', 'mai'], metade:['met', 'hal'], raro:['rar', 'sel']};
function casarPrefixo(mapa, txt){
  const v = normTxt(txt || '').slice(0, 3);
  return Object.keys(mapa).find(k => mapa[k].includes(v)) || null;
}
function parseColagem(txt){
  return String(txt || '').split(/\r?\n/).map(l => {
    const c = (l.includes('\t') ? l.split('\t') : l.split(';')).map(x => x.trim());
    const pessoas = parseInt(c[1], 10), duracao = parseInt(c[2], 10);
    if (!c[0] || !Number.isFinite(pessoas) || !Number.isFinite(duracao)) return null;   // cabeçalho ou linha vazia
    return {nome:c[0].slice(0, 80), pessoas:Math.min(300, Math.max(1, pessoas)), duracao:Math.min(480, Math.max(5, duracao)),
      freq: casarPrefixo(PREFIXOS_FREQ, c[3]) || 'semanal', pauta: casarPrefixo(PREFIXOS_PAUTA, c[4]) || 'sempre'};
  }).filter(Boolean);
}

/* ---------- link compartilhável (respostas codificadas no endereço) ---------- */
function codificarDiagnostico(r, x){
  const i = (campo, v) => VALORES[campo].indexOf(v);
  return ['v1', i('objetivo', r.objetivo), i('info', r.info), i('discordancia', r.discordancia), r.total, r.contribuem,
    i('urgencia', r.urgencia), i('recorrente', r.recorrente), r.recorrente === 'sim' ? i('pautaNova', r.pautaNova) : 'x',
    i('abstracao', r.abstracao), x.dur, Math.round(x.cph), Object.keys(OCORRENCIAS).indexOf(x.freq), x.moeda].join('.');
}
function decodificarDiagnostico(s){
  const p = String(s || '').split('.');
  if (p[0] !== 'v1' || p.length !== 14) return null;
  const pega = (campo, k) => /^\d+$/.test(k) ? VALORES[campo][+k] : undefined;
  const r = {objetivo:pega('objetivo', p[1]), info:pega('info', p[2]), discordancia:pega('discordancia', p[3]),
    total:parseInt(p[4], 10), contribuem:parseInt(p[5], 10), urgencia:pega('urgencia', p[6]), recorrente:pega('recorrente', p[7]),
    pautaNova: p[8] === 'x' ? null : pega('pautaNova', p[8]), abstracao:pega('abstracao', p[9])};
  const dur = parseInt(p[10], 10), cph = parseInt(p[11], 10), freq = Object.keys(OCORRENCIAS)[+p[12]], moeda = p[13];
  if (camposFaltando(r).length || r.total > 300 || r.contribuem > r.total) return null;
  if (!(dur >= 5 && dur <= 240) || !(cph >= 0) || !freq || !MOEDAS.includes(moeda)) return null;
  return {r, dur, cph, freq, moeda};
}

/* ---------- custos do time por link ---------- */
function b64urlCodificar(txt){ return btoa(unescape(encodeURIComponent(txt))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecodificar(s){ return decodeURIComponent(escape(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')))); }
function codificarConfig(c){ return b64urlCodificar(JSON.stringify({v:1, moeda:c.moeda, taxa:c.taxa, niveis:c.niveis.map(n => [n.nome, n.taxa])})); }
function decodificarConfig(s){
  try {
    const o = JSON.parse(b64urlDecodificar(s));
    if (o.v !== 1 || !MOEDAS.includes(o.moeda) || !(+o.taxa >= 0) || !Array.isArray(o.niveis)) return null;
    const niveis = o.niveis.filter(n => Array.isArray(n) && typeof n[0] === 'string' && +n[1] >= 0).slice(0, 12).map(n => ({nome:n[0].slice(0, 24), taxa:+n[1]}));
    return niveis.length ? {moeda:o.moeda, taxa:+o.taxa, niveis} : null;
  } catch (e){ return null; }
}

/* ---------- Microsoft 365: deep links, .ics, CSV ---------- */
function isoLocal(d){
  const p = n => String(n).padStart(2, '0');
  const off = -d.getTimezoneOffset(), s = off >= 0 ? '+' : '-', a = Math.abs(off);
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00${s}${p(Math.floor(a / 60))}:${p(a % 60)}`;
}

function qs(obj){ return Object.entries(obj).filter(([, v]) => v !== undefined && v !== null && v !== '').map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&'); }

function parseEmails(s){ return String(s || '').split(/[;,\s]+/).map(x => x.trim()).filter(x => /^[^@\s<>()"]+@[^@\s<>()"]+\.[^@\s<>()"]+$/.test(x)); }

function gerarICS(e){
  const utc = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const escI = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const enc = new TextEncoder();
  const dobrar = linha => {   // RFC 5545: linhas de até 75 octetos, continuação começa com espaço
    const partes = []; let atual = '', bytes = 0;
    for (const ch of linha){
      const b = enc.encode(ch).length;
      if (bytes + b > 73){ partes.push(atual); atual = ' '; bytes = 1; }
      atual += ch; bytes += b;
    }
    partes.push(atual);
    return partes.join('\r\n');
  };
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Engine de Reunioes//PT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    `UID:${e.uid}@engine-reunioes`, `DTSTAMP:${utc(new Date())}`, `DTSTART:${utc(e.inicio)}`, `DTEND:${utc(e.fim)}`,
    `SUMMARY:${escI(e.assunto)}`, `DESCRIPTION:${escI(e.corpo)}`, 'END:VEVENT', 'END:VCALENDAR'].map(dobrar).join('\r\n') + '\r\n';
}

function gerarCSV(linhas, sep){
  return linhas.map(l => l.map(c => {
    const s = c === null || c === undefined ? '' : String(c);
    return s.includes(sep) || /["\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(sep)).join('\r\n');
}

async function copiar(texto, msgOk){
  let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; }
  catch (e){
    const ta = document.createElement('textarea');
    ta.value = texto; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2){ ok = false; }
    ta.remove();
  }
  toast(ok ? (msgOk || T.ui.geral.copiado) : T.ui.geral.falhaCopiar);
  return ok;
}
// Texto + HTML: colar no Outlook/Teams mantém a formatação.
async function copiarRico(texto, html, msgOk){
  try {
    await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([texto], {type:'text/plain'}), 'text/html':new Blob([html], {type:'text/html'})})]);
    toast(msgOk);
  } catch (e){ copiar(texto, msgOk); }
}
function baixar(nome, conteudo, tipo){
  const url = URL.createObjectURL(new Blob([conteudo], {type:tipo}));
  const a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

  input.value = Math.max(min, Math.min(max, novo));

  input.dispatchEvent(new Event('change', {bubbles:true}));
});

let formIdioma = null;
const CAMPOS = [
  {id:'objetivo', cols:'c2'}, {id:'info', ajuda:'infoAjuda', cols:'c3'}, {id:'discordancia', cols:'c3'},
  {id:'total', num:true, min:2}, {id:'contribuem', num:true, min:1, ajuda:'contribuemAjuda'},
  {id:'urgencia', cols:'c3'}, {id:'recorrente', cols:'c2', sub:'pautaNova'}, {id:'abstracao', ajuda:'abstracaoAjuda', cols:'c2'},
];
function htmlQuestao(c, i){
  const D = T.ui.diag, Q = D.perguntas, n = String(i + 1).padStart(2, '0');
  const tag = '<span class="tag" hidden></span>';
  const ajuda = c.ajuda ? `<p class="q-ajuda" id="aj-${c.id}">${Q[c.ajuda]}</p>` : '';
  if (c.num) return `
    <div class="q" data-campo="${c.id}" id="q-${c.id}">
      <label class="q-leg" for="in-${c.id}" data-falta="${esc(D.falta)}"><span class="q-n">${n}</span>${Q[c.id]}${tag}</label>${ajuda}
      <div class="num-linha">
        <div class="stepper"><button type="button" class="st-btn" data-passo="-1" aria-label="${D.diminuir}">−</button><input type="number" inputmode="numeric" id="in-${c.id}" name="${c.id}" min="${c.min}" max="300" placeholder="–"${c.ajuda ? ` aria-describedby="aj-${c.id}"` : ''}><button type="button" class="st-btn" data-passo="1" aria-label="${D.aumentar}">+</button></div>
        <span class="st-un">${D.pessoas}</span>
      </div>
      ${c.id === 'contribuem' ? '<div class="prop" id="proporcao" hidden><div class="prop-txt"><span id="prop-a"></span><span id="prop-b"></span></div><div class="prop-trilho"><div class="prop-fill" id="prop-fill"></div></div></div>' : ''}
    </div>`;
  const sub = c.sub ? `<div class="sub" id="sub-${c.sub}" hidden><fieldset><legend class="sub-q">${Q[c.sub]}</legend>${htmlChips(c.sub, VALORES[c.sub], T.opcoes[c.sub], 'c2')}</fieldset></div>` : '';
  return `
    <div class="q" data-campo="${c.id}" id="q-${c.id}">
      <fieldset${c.ajuda ? ` aria-describedby="aj-${c.id}"` : ''}><legend data-falta="${esc(D.falta)}"><span class="q-n">${n}</span>${Q[c.id]}${tag}</legend>${ajuda}
      ${htmlChips(c.id, VALORES[c.id], T.opcoes[c.id], c.cols)}</fieldset>${sub}
    </div>`;
}
function construirDiagnostico(){
  const salvas = $('#form') ? lerRespostas() : null;
  const D = T.ui.diag;
  $('#tela-diagnostico').innerHTML = `
    <div class="tela-head tela-head-linha">
      <div><span class="kicker">${D.kicker}</span><h1 class="t-tela" tabindex="-1">${D.titulo}</h1></div>
      <button class="btn btn-ghost" data-ir="prefill">${ICONE.ia}${D.btnIA}</button>
    </div>
    <div class="modelos"><span class="kicker">${D.modelos}</span>${Object.keys(MODELOS).map(k =>
      `<button type="button" class="modelo-btn" data-modelo="${k}">${D.modelosNomes[k]}</button>`).join('')}<span class="nota">${D.modelosDica}</span></div>
    <div class="aviso-ia" id="aviso-ia" hidden>${ICONE.ia}<div id="aviso-ia-txt"></div></div>
    <form id="form" class="form-grid" novalidate>${CAMPOS.map(htmlQuestao).join('')}</form>
    <div class="barra-envio">
      <div class="progresso" aria-live="polite"><span class="prog-txt" id="prog-txt"></span><div class="prog-trilho"><div class="prog-fill" id="prog-fill"></div></div></div>
      <div class="previa" id="previa" hidden></div>
      <span class="atalho">${D.atalho}</span>
      <button class="btn btn-primary" id="btn-calcular" type="submit" form="form"></button>
    </div>`;
  const form = $('#form');
  form.addEventListener('input', atualizarForm);
  form.addEventListener('change', e => {
    if (e.target.type === 'number') limitarNumeros();
    removerTag(e.target.name);
    atualizarForm();
  });
  form.addEventListener('submit', aoEnviar);
  $('#tela-diagnostico .modelos').addEventListener('click', e => { const b = e.target.closest('[data-modelo]'); if (b) aplicarModelo(b.dataset.modelo); });
  formIdioma = idioma;
  if (salvas) aplicarValores(salvas);
}
function garantirDiagnostico(){
  if (formIdioma !== idioma) construirDiagnostico();
  marcarTags();
  const A = estado.avisoIA, P = T.ui.pf;
  if (A){
    $('#aviso-ia-txt').innerHTML = `<p>${P.aviso(A.n, camposFaltando(lerRespostas()).length)}</p>`
      + (A.obs ? `<p>${esc(P.nota(A.obs))}</p>` : '') + (A.invalidos.length ? `<p>${esc(P.ignorados(A.invalidos.join(', ')))}</p>` : '');
  }
  $('#aviso-ia').hidden = !A;
  $('#btn-calcular').textContent = estado.tags.campos.length ? T.ui.diag.revisei : T.ui.diag.ver;
  atualizarForm();
}
function lerRespostas(){
  const f = $('#form').elements, r = {};
  [...Object.keys(VALORES)].forEach(k => { r[k] = f[k].value || null; });
  const num = k => { const v = parseInt(f[k].value, 10); return Number.isFinite(v) ? v : null; };
  r.total = num('total');
  r.contribuem = num('contribuem');
  if (r.recorrente !== 'sim') r.pautaNova = null;
  return r;
}
function aplicarValores(v){
  const f = $('#form').elements;
  Object.entries(v).forEach(([k, val]) => { if (f[k] && val !== null && val !== undefined) f[k].value = val; });
  atualizarForm();
}
function limitarNumeros(){
  const f = $('#form').elements;
  const t = parseInt(f.total.value, 10), k = parseInt(f.contribuem.value, 10);
  if (Number.isFinite(t)) f.total.value = Math.max(2, Math.min(300, t));
  const tt = parseInt(f.total.value, 10);
  if (Number.isFinite(k)) f.contribuem.value = Math.max(1, Math.min(Number.isFinite(tt) ? tt : 300, k));
}
function atualizarForm(){
  if (!$('#form')) return;
  const D = T.ui.diag, r = lerRespostas(), f = $('#form').elements;
  $('#sub-pautaNova').hidden = r.recorrente !== 'sim';
  if (r.recorrente !== 'sim') $$('#form input[name=pautaNova]').forEach(i => { i.checked = false; });
  if (r.total >= 2) f.contribuem.max = r.total;

  // Proporção de quem contribui (campo 5 ÷ campo 4)
  const prop = $('#proporcao');
  if (r.total >= 2 && r.contribuem >= 1){
    const k = Math.min(r.contribuem, r.total), ratio = k / r.total, ouvintes = r.total - k;
    prop.hidden = false;
    $('#prop-a').innerHTML = D.prop(k, r.total, Math.round(ratio * 100));
    $('#prop-b').textContent = r.contribuem > r.total ? D.propMax(r.total) : ouvintes === 0 ? D.propTodos : D.propOuvintes(ouvintes, ratio < .5 && r.total > 3);
    prop.style.setProperty('--prop-cor', ratio >= .5 ? 'var(--acc)' : ratio >= .3 ? 'var(--band-async)' : 'var(--band-skip)');
    $('#prop-fill').style.width = ratio * 100 + '%';
  } else prop.hidden = true;

  const falta = camposFaltando(r), feitas = 8 - falta.length;
  $('#prog-txt').textContent = D.progresso(feitas);
  $('#prog-fill').style.width = feitas / 8 * 100 + '%';
  $$('.q.falta').forEach(q => { if (!falta.includes(q.dataset.campo)) q.classList.remove('falta'); });

  // Prévia ao vivo: dá para testar "e se" antes de abrir o resultado
  const previa = $('#previa');
  if (!falta.length && r.contribuem <= r.total){
    const res = avaliar(r);
    previa.innerHTML = `<span class="kicker">${D.previa}</span><span class="pill ${res.faixa}">${ICONE[res.faixa]}${T.faixas[res.faixa].rotulo}</span><span class="v-score">${T.ui.res.score} <b>${res.score}</b>/100</span>`;
    previa.hidden = false;
  } else previa.hidden = true;
}
function marcarTags(){
  $$('#form .tag').forEach(t => { t.hidden = true; });
  const texto = estado.tags.tipo === 'ia' ? T.ui.diag.tagIA : T.ui.diag.tagModelo;
  estado.tags.campos.forEach(c => {
    const tag = $(`#q-${c === 'pautaNova' ? 'recorrente' : c} .tag`);
    if (tag){ tag.textContent = texto; tag.hidden = false; }
  });
}
function removerTag(nome){
  if (!estado.tags.campos.includes(nome)) return;
  estado.tags.campos = estado.tags.campos.filter(c => c !== nome);
  marcarTags();
}
function aplicarModelo(k){
  if (estado.respostas) novaAvaliacao();
  estado.avisoIA = null;
  if (MODELOS[k].recorrente === 'sim') $$('#form input[name=pautaNova]').forEach(i => { i.checked = false; });
  aplicarValores(MODELOS[k]);
  estado.tags = {campos:Object.keys(MODELOS[k]), tipo:'modelo'};
  garantirDiagnostico();
  toast(T.ui.diag.modeloAplicado(T.ui.diag.modelosNomes[k]));
  const falta = camposFaltando(lerRespostas());
  if (falta.length){
    const q = $('#q-' + falta[0]);
    q.scrollIntoView({behavior:reduzMovimento.matches ? 'auto' : 'smooth', block:'center'});
    const inp = q.querySelector('input');
    if (inp) setTimeout(() => inp.focus({preventScroll:true}), 250);
  }
}
function novaAvaliacao(){
  if ($('#form')) $('#form').reset();
  Object.assign(estado, {respostas:null, res:null, resultadoIdioma:null, entradaId:null, contexto:'', compartilhado:null,
    duracaoAtual:null, custoAtual:null, tags:{campos:[], tipo:null}, avisoIA:null});
  $$('.q.falta').forEach(q => q.classList.remove('falta'));
  if ($('#form')) garantirDiagnostico();
}
function aoEnviar(e){
  e.preventDefault();
  limitarNumeros();
  const r = lerRespostas(), falta = camposFaltando(r);
  if (falta.length){
    falta.forEach(c => $('#q-' + c).classList.add('falta'));
    const primeiro = $('#q-' + falta[0]);
    primeiro.scrollIntoView({behavior:reduzMovimento.matches ? 'auto' : 'smooth', block:'center'});
    const foco = primeiro.querySelector('input');
    if (foco) setTimeout(() => foco.focus({preventScroll:true}), 300);
    toast(falta.length === 1 ? T.ui.geral.faltaUma : T.ui.geral.faltam(falta.length));
    return;
  }
  Object.assign(estado, {respostas:r, compartilhado:null, duracaoAtual:null, custoAtual:null, tags:{campos:[], tipo:null}, avisoIA:null});
  salvarEntrada(r);
  renderResultado();
  ir('resultado');
}

/* =====================================================================
   RESULTADO (Módulos 1 + 2 + 3) + Microsoft 365
   ===================================================================== */
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function garantirResultado(){ if (estado.resultadoIdioma !== idioma) renderResultado(); }

function destaque(r, res){
  const D = T.ui.res.dest;
  if (res.faixa === 'meet') return {k:D.duracao, v:`${res.duracao.min}<small>min</small>`, x:res.duracao.motivo};
  if (res.faixa === 'async') return {k:D.prazoRetorno, v:esc(T.prazoCurto[r.urgencia]), txt:true, x:D.callNota(res.duracaoCall.min, r.contribuem)};
  if (res.flags.recorrenteSemPauta) return {k:D.ocorrencia, v:esc(D.cancelar), txt:true, x:D.semPautaNota};
  return {k:D.prazo, v:esc(T.prazoCurto[r.urgencia]), txt:true, x:D.msgNota};
}

function renderResultado(){
  const r = estado.respostas, res = avaliar(r), R = T.ui.res, F = T.faixas[res.faixa];
  estado.res = res;
  estado.resultadoIdioma = idioma;
  if (!estado.duracaoAtual) estado.duracaoAtual = res.duracao.min;
  const zonas = [['skip', CORTE_ASYNC], ['async', CORTE_REUNIAO - CORTE_ASYNC], ['meet', 100 - CORTE_REUNIAO]];
  const avisos = [];
  if (res.flags.recorrenteSemPauta) avisos.push(R.avisos.semPauta);
  if (res.flags.prematura) avisos.push(R.avisos.prematura(res.bruto));
  if (res.flags.excecaoUrgencia) avisos.push(R.avisos.excecao(T.faixas[res.flags.faixaSemExcecao].rotulo));
  const dest = destaque(r, res);

  $('#tela-resultado').innerHTML = `
    <div class="tela-head-linha" style="margin-bottom:16px">
      <button class="voltar" data-ir="diagnostico">${R.editar}</button>
      <div class="acoes">
        <button class="btn btn-ghost btn-sm" id="btn-link">${ICONE.link}${R.copiarLink}</button>
        <button class="btn btn-ghost btn-sm" data-acao="nova">${R.nova}</button>
      </div>
    </div>
    ${estado.compartilhado ? `<div class="banner">${ICONE.info}<div class="banner-txt"><p>${R.compartilhado}</p></div><button class="btn btn-ghost btn-sm" data-acao="nova">${R.fazerMeu}</button></div>` : ''}
    <article class="veredito v-${res.faixa}">
      <div class="v-grid">
        <div>
          <div class="v-top"><span class="pill ${res.faixa}">${ICONE[res.faixa]}${F.rotulo}</span><span class="v-score">${R.score} <b>${res.score}</b>/100</span></div>
          <h1 class="v-titulo" tabindex="-1">${F.titulo}</h1>
          <p class="v-sub">${F.sub}</p>
          ${avisos.length ? `<div class="avisos">${avisos.map(a => `<p class="aviso">${ICONE.info}<span>${esc(a)}</span></p>`).join('')}</div>` : ''}
        </div>
        <div class="v-lado">
          <div class="v-destaque"><span class="kicker">${dest.k}</span><span class="v-dest-num${dest.txt ? ' txt' : ''}">${dest.v}</span><p>${esc(dest.x)}</p></div>
          <div class="gauge" role="img" aria-label="${esc(R.gauge(res.score, T.faixas[res.faixaScore].rotulo))}">
            <div class="g-trilho">${zonas.map(([k, w]) => `<span class="g-z g-${k}${res.faixaScore === k ? ' on' : ''}" style="flex:${w}"></span>`).join('')}<span class="g-marca" style="left:${res.score}%"></span></div>
            <div class="g-rotulos" aria-hidden="true">${zonas.map(([k, w]) => `<span style="flex:${w}"${res.faixaScore === k ? ' class="on"' : ''}>${T.faixas[k].curto}</span>`).join('')}</div>
          </div>
        </div>
      </div>
    </article>
    <div class="res-grid">
      <div class="res-col">
        ${htmlPorque(res)}
        ${res.faixa === 'meet' ? htmlPauta() : htmlMensagem(r, res)}
        ${htmlIA(res)}
      </div>
      <div class="res-col">
        <section>
          <div class="bloco-head"><span class="kicker">${R.custoKicker}</span><h2>${res.faixa === 'meet' ? R.custoMeet : res.faixa === 'async' ? R.custoAsync : R.custoSkip}</h2></div>
          <div id="res-calc" class="calc-host"></div>
        </section>
        ${htmlDicas(r, res)}
      </div>
    </div>`;

  $('#btn-link').addEventListener('click', copiarLinkDiagnostico);
  if (res.faixa === 'meet'){
    atualizarPauta();
    $('#btn-copiar-pauta').addEventListener('click', copiarPauta);
    $('#ms-ics').addEventListener('click', baixarICS);
  } else {
    $('#btn-copiar-msg').addEventListener('click', () => copiar($('#msg').value, R.msgCopiada));
    $('#msg').addEventListener('input', atualizarLinksMS);
  }
  ['ms-assunto', 'ms-inicio', 'ms-para'].forEach(id => { const c = $('#' + id); if (c) c.addEventListener('input', atualizarLinksMS); });
  $('#ctx').addEventListener('input', e => { estado.contexto = e.target.value; atualizarPrompt(); });
  $('#btn-prompt').addEventListener('click', () => copiar(textoPrompt(), T.ui.ia.copiado));
  $('#res-dicas').addEventListener('change', () => {
    const caixas = $$('#res-dicas input[type=checkbox]');
    $('#check-cont').textContent = R.dicasCont(caixas.filter(c => c.checked).length, caixas.length);
  });

  const comp = estado.compartilhado;
  montarCalculadora($('#res-calc'), {
    pessoas:r.total, duracao:estado.duracaoAtual, recorrente:r.recorrente === 'sim',
    rotulo: res.faixa === 'meet' ? R.rotMeet : R.rotEvitada,
    fixo: comp ? {taxa:comp.cph / r.total, moeda:comp.moeda, freq:comp.freq} : null,
    aoMudar: v => {
      estado.custoAtual = v;
      if (!comp) atualizarCustoEntrada(v);
      if (v.duracao !== estado.duracaoAtual){ estado.duracaoAtual = v.duracao; atualizarPauta(); }
      atualizarLinksMS();
      atualizarPrompt();
    },
  });
  atualizarLinksMS();
  atualizarPrompt();
}

function htmlPorque(res){
  const R = T.ui.res;
  const fmtPts = l => l.rotPts ? l.rotPts : l.pts > 0 ? `+${l.pts}` : l.pts < 0 ? `−${Math.abs(l.pts)}` : '0';
  const soma = res.flags.recorrenteSemPauta ? R.zerado(res.bruto) : res.bruto !== res.score ? R.limitado(res.bruto, res.score) : String(res.score);
  return `<details class="porque" open><summary>${R.porque}</summary><div class="porque-corpo">
    <ul class="linhas">${res.linhas.map(l => `<li><div><span class="kicker">${esc(l.fator)}</span><span class="l-escolha">${esc(l.escolha)}</span><span class="l-nota">${esc(l.nota)}</span></div><span class="l-pts${l.pts === 0 || l.rotPts === '—' ? ' zero' : ''}">${esc(fmtPts(l))}</span></li>`).join('')}</ul>
    <div class="soma"><span>${R.score}</span><span>${esc(soma)}</span></div>
    <p class="cortes">${R.cortes(CORTE_ASYNC, CORTE_REUNIAO)}</p></div></details>`;
}

  const R = T.ui.res, M = T.ui.ms;
  return `<section>
    <div class="bloco-head"><span class="kicker">${R.formato}</span><h2 id="pauta-titulo"></h2></div>
    <div class="card">
      <ol class="pauta" id="pauta"></ol>
      <div class="acoes"><button class="btn btn-ghost btn-sm" id="btn-copiar-pauta">${R.copiarPauta}</button></div>
      <div class="separador"></div>
      <h3 class="sub-titulo">${M.tituloReuniao}</h3>
      <div class="campos-ms">
        <label class="campo"><span>${M.assunto}</span><input type="text" id="ms-assunto" placeholder="${esc(M.assuntoPh)}"></label>
        <label class="campo"><span>${M.quando}</span><input type="datetime-local" id="ms-inicio" value="${valorDatetime(proximoDiaUtil())}"></label>
        <label class="campo campo-largo"><span>${M.participantes}</span><input type="text" id="ms-para" placeholder="${esc(M.participantesPh)}"></label>
      </div>
      <div class="acoes">
        <a class="btn btn-primary btn-sm" id="ms-teams" target="_blank" rel="noopener">${M.teams}</a>
        <a class="btn btn-ghost btn-sm" id="ms-outlook" target="_blank" rel="noopener">${M.outlookWeb}</a>
        <button class="btn btn-ghost btn-sm" id="ms-ics">${M.ics}</button>
      </div>
      <p class="nota">${M.nota}</p>
    </div>
  </section>`;
}

function htmlMensagem(r, res){
  const R = T.ui.res, M = T.ui.ms;
  const titulo = res.faixa === 'async' ? R.tituloAsync : res.flags.recorrenteSemPauta ? R.tituloCancelar : R.tituloSkip;
  const passos = res.faixa === 'async' ? `
      <ol class="estrutura" style="margin-bottom:18px">
        <li><b>${R.p1t}</b><span>${R.p1x}</span></li>
        <li><b>${R.p2t}</b><span>${R.p2x(T.prazo[r.urgencia])}</span></li>
        <li><b>${R.p3t(res.duracaoCall.min)}</b><span>${R.p3x(r.contribuem)}</span></li>
      </ol>
      <span class="kicker">${R.estruturaMsg}</span>` : '';
  const assunto = res.flags.recorrenteSemPauta ? M.assuntoCancelar : M.assuntoMsgPadrao(rotulo('objetivo', r.objetivo));
  return `<section>
    <div class="bloco-head"><span class="kicker">${R.oQueFazer}</span><h2>${titulo}</h2></div>
    <div class="card">
      ${passos}
      <ol class="estrutura"${res.faixa === 'async' ? ' style="margin-top:12px"' : ''}>
        <li><b>${R.est1t}</b><span>${R.est1x}</span></li>
        <li><b>${R.est2t}</b><span>${R.est2x}</span></li>
        <li><b>${R.est3t}</b><span>${esc(R.est3x(cap(T.prazo[r.urgencia])))}</span></li>
      </ol>
      <label class="rot" for="msg">${R.mensagemRot}</label>
      <textarea id="msg" rows="6">${esc(modeloMensagem(r, res))}</textarea>
      <div class="acoes"><button class="btn btn-ghost btn-sm" id="btn-copiar-msg">${R.copiarMsg}</button></div>
      <div class="separador"></div>
      <h3 class="sub-titulo">${M.tituloMsg}</h3>
      <div class="campos-ms">
        <label class="campo"><span>${M.para}</span><input type="text" id="ms-para" placeholder="${esc(M.paraPh)}"></label>
        <label class="campo"><span>${M.assunto}</span><input type="text" id="ms-assunto" value="${esc(assunto)}"></label>
      </div>
      <div class="acoes">
        <a class="btn btn-primary btn-sm" id="ms-mailto">${M.mailto}</a>
        <a class="btn btn-ghost btn-sm" id="ms-outlook" target="_blank" rel="noopener">${M.outlookWebMail}</a>
        <a class="btn btn-ghost btn-sm" id="ms-teams" target="_blank" rel="noopener">${M.teamsChat}</a>
      </div>
      <p class="nota" id="ms-nota"></p>
    </div>
  </section>`;
}

function htmlIA(res){
  const I = T.ui.ia;
  return `<div class="card ia-card"><span class="kicker">${I.kicker}</span><p>${I.texto}</p>
    <label class="rot" for="ctx">${I.ctx} <span class="muted">${I.ctxOpc}</span></label>
    <textarea id="ctx" rows="3" placeholder="${esc(I.ctxPh)}">${esc(estado.contexto)}</textarea>
    <div class="acoes"><button class="btn btn-primary btn-sm" id="btn-prompt">${ICONE.ia}${res.faixa === 'meet' ? I.btnPauta : I.btnMsg}</button></div>
    <details class="previa-txt"><summary>${I.ver}</summary><pre class="bloco-txt" id="prompt-previa"></pre></details></div>`;
}

function htmlDicas(r, res){
  const R = T.ui.res, dicas = gerarDicas(r, res);

function proximoDiaUtil(){
  const d = new Date();
  d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  d.setHours(10, 0, 0, 0);
  return d;
}
function valorDatetime(d){ const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function lerInicio(){ const v = $('#ms-inicio') ? $('#ms-inicio').value : ''; const d = v ? new Date(v) : null; return d && !isNaN(d) ? d : null; }

function corpoConvite(){
  const r = estado.respostas, M = T.ui.ms, dur = estado.duracaoAtual, c = estado.custoAtual;
  const linhas = [M.corpoObjetivo, '', M.corpoPauta(dur), ...esqueletoPauta(r, estado.res, dur).map(b => `${b.ini}–${b.fim} min · ${b.t}`)];
  if (r.objetivo === 'decisao' || r.objetivo === 'discordancia') linhas.push('', M.corpoPreLeitura);
  if (c) linhas.push('', M.corpoCusto(fmtMoeda(c.custo, c.moeda), c.pessoas, dur));
  if (r.recorrente === 'sim') linhas.push(M.corpoRegra);
  return linhas.join('\n');
}

/* =====================================================================
   MÓDULO 2 — calculadora de custo (componente reutilizável)
   custo = Σ (participantes × custo/hora do nível) × duração em horas
   ===================================================================== */
function criarOdometro(el){
  let texto = '', slots = [];
  const pos = (fita, v) => { fita.style.transform = `translateY(${-v * 10}%)`; };
  function montar(t){
    el.textContent = '';
    slots = [...t].map(ch => {
      if (/\d/.test(ch)){
        const d = document.createElement('span'); d.className = 'odo-d';
        const fita = document.createElement('span'); fita.className = 'odo-fita';
        fita.innerHTML = '<span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span>';
        d.appendChild(fita); el.appendChild(d);
        return {digito:true, fita, val:0};
      }
      const s = document.createElement('span'); s.className = 'odo-s'; s.textContent = ch; el.appendChild(s);
      return {digito:false, ch};
    });
  }
  return function(t){
    if (t === texto) return;
    const chars = [...t];
    const mesmaForma = chars.length === slots.length && chars.every((ch, i) => /\d/.test(ch) === slots[i].digito && (slots[i].digito || slots[i].ch === ch));
    if (!mesmaForma){
      // Reconstrói mantendo os dígitos antigos alinhados à direita, para rolar a partir deles.
      const antigos = slots.filter(s => s.digito).map(s => s.val);
      montar(t);
      const novos = slots.filter(s => s.digito);
      el.classList.add('sem-trans');
      novos.forEach((s, i) => { const j = antigos.length - novos.length + i; s.val = j >= 0 ? antigos[j] : 0; pos(s.fita, s.val); });
      void el.offsetWidth;
      el.classList.remove('sem-trans');
    }
    chars.forEach((ch, i) => { const s = slots[i]; if (s.digito && +ch !== s.val){ s.val = +ch; pos(s.fita, s.val); } });
    texto = t;
  };
}

  if (custoMontado === idioma) return;
  const C = T.ui.custo;
  $('#tela-custo').innerHTML = `
