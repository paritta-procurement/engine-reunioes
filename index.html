function montarCalculadora(host, ini){
  // Raiz nova a cada montagem: os listeners morrem junto com a instância anterior.
  const el = document.createElement('div');
  host.replaceChildren(el);
  const C = T.ui.calc, cfg = lerConfig(), fixo = ini.fixo;
  const st = {
    modo: fixo ? 'rapido' : cfg.modo, taxa: fixo ? Math.round(fixo.taxa) : cfg.taxa,
    freq: fixo ? fixo.freq : cfg.freq, moeda: fixo ? fixo.moeda : cfg.moeda,
    niveis: cfg.niveis.map(n => ({nome:n.nome, taxa:n.taxa, qtd:0})),
    pessoas: Math.max(1, ini.pessoas || 1), duracao: ini.duracao || 30, recorrente: !!ini.recorrente,
  };
  st.niveis[0].qtd = st.pessoas;
  const id = 'c' + Math.random().toString(36).slice(2, 8);

  el.innerHTML = `
    <div class="calc card">
      <div class="calc-a">
        <div class="calc-visor">
          <span class="kicker">${esc(ini.rotulo || C.rotulo)}</span>
          <div class="odo-linha"><span class="odo-moeda" data-simbolo></span><span class="odo" aria-hidden="true"></span></div>
          <span class="sr-only" data-sr></span>
          <p class="cv-detalhe" data-detalhe></p>
        </div>
        <div class="calc-anual" data-anual>
          <div class="tile"><span class="t-rot">${C.mes}</span><span class="t-val" data-mes></span></div>
          <div class="tile"><span class="t-rot">${C.ano}</span><span class="t-val" data-ano></span></div>
          <div class="tile"><span class="t-rot">${C.horasAno}</span><span class="t-val" data-horas></span></div>
          <p class="anual-nota" data-anual-nota></p>
        </div>
        <div class="calc-pe">
          <button type="button" class="btn btn-ghost btn-sm" data-copiar-convite>${C.copiarConvite}</button>
          ${fixo ? `<p class="nota" style="flex-basis:100%;margin:4px 0 0">${C.somenteLeitura}</p>` : `<button type="button" class="btn btn-ghost btn-sm" data-compartilhar>${ICONE.link}${C.compartilhar}</button>`}
        </div>
      </div>
      <div class="calc-corpo">
        <div>
          <div class="campo-rot"><label for="${id}-dur">${C.duracao}</label><output data-dur-out for="${id}-dur"></output></div>
          <input type="range" id="${id}-dur" min="5" max="120" step="5" data-dur>
          <div class="presets" role="group" aria-label="${C.duracoes}">${[15, 30, 45, 60, 90].map(m => `<button type="button" class="preset" data-preset="${m}" aria-pressed="false">${m} min</button>`).join('')}</div>
        </div>
        <div>
          <div class="campo-rot"><span id="${id}-modo">${C.custoHora}</span><label>${C.moeda} <select data-moeda${fixo ? ' disabled' : ''}>${MOEDAS.map(m => `<option value="${m}">${m}</option>`).join('')}</select></label></div>
          <div class="seg" role="radiogroup" aria-labelledby="${id}-modo"${fixo ? ' hidden' : ''}>
            <label><input type="radio" name="${id}-modo" value="rapido"><span>${C.rapido}</span></label>
            <label><input type="radio" name="${id}-modo" value="detalhado"><span>${C.detalhado}</span></label>
          </div>
        </div>
        <div class="linha-campos" data-rapido>
          <div>
            <div class="campo-rot"><label for="${id}-pes">${C.participantes}</label></div>
            <div class="stepper"><button type="button" class="st-btn" data-passo="-1" aria-label="${C.menosUma}">−</button><input type="number" inputmode="numeric" min="1" max="300" id="${id}-pes" data-pessoas><button type="button" class="st-btn" data-passo="1" aria-label="${C.maisUma}">+</button></div>
          </div>
          <div>
            <div class="campo-rot"><label for="${id}-taxa">${C.custoMedio}</label></div>
            <label class="moeda"><span data-simbolo></span><input type="number" inputmode="decimal" min="0" step="5" id="${id}-taxa" data-taxa${fixo ? ' readonly' : ''}><span>/h</span></label>
          </div>
          ${fixo ? '' : `<p class="dica-taxa">${C.dicaTaxa}</p>`}
        </div>
        <div data-detalhado>
          <div data-niveis></div>
          <div class="niveis-pe"><button type="button" class="link" data-add-nivel>${C.addNivel}</button><span data-total-niveis></span></div>
        </div>
        <div class="recorr">
          <label class="switch"><input type="checkbox" data-recorrente><span class="sw" aria-hidden="true"></span><span>${C.recorrente}</span></label>
          <div class="freqs" role="radiogroup" aria-label="${C.frequencia}" data-freqs>${Object.keys(OCORRENCIAS).map(k =>
            `<label class="freq"><input type="radio" name="${id}-freq" value="${k}"><span>${T.opcoes.freq[k]}</span></label>`).join('')}</div>
        </div>
      </div>
    </div>`;

  const q = s => el.querySelector(s);
  const odometro = criarOdometro(q('.odo'));
  const salvar = debounce(() => { if (!fixo) gravarConfig(st); }, 300);
  const avisar = debounce(v => { if (ini.aoMudar) ini.aoMudar(v); }, 250);

  q('[data-dur]').value = st.duracao;
  q('[data-pessoas]').value = st.pessoas;
  q('[data-taxa]').value = st.taxa;
  q('[data-moeda]').value = st.moeda;
  q(`input[name="${id}-modo"][value="${st.modo}"]`).checked = true;
  q(`input[name="${id}-freq"][value="${st.freq}"]`).checked = true;
  q('[data-recorrente]').checked = st.recorrente;

  const somaNiveis = () => st.niveis.reduce((s, n) => s + n.qtd, 0);
  const pessoasEf = () => st.modo === 'rapido' ? st.pessoas : somaNiveis();
  const custoHora = () => st.modo === 'rapido' ? st.pessoas * st.taxa : st.niveis.reduce((s, n) => s + n.qtd * n.taxa, 0);
  const valores = () => {
    const custo = custoHora() * st.duracao / 60, oc = OCORRENCIAS[st.freq];
    return {custo, custoAno: st.recorrente ? custo * oc : null, duracao:st.duracao, pessoas:pessoasEf(), freq:st.freq, moeda:st.moeda};
  };

  function renderNiveis(){
    q('[data-niveis]').innerHTML = st.niveis.map((n, i) => `
      <div class="nivel" data-i="${i}">
        <input class="n-nome" type="text" value="${esc(n.nome)}" maxlength="24" aria-label="${esc(C.nomeNivel(i + 1))}" data-n-nome>
        <label class="moeda"><span data-simbolo></span><input type="number" inputmode="decimal" min="0" step="5" value="${n.taxa}" aria-label="${esc(C.custoNivel(n.nome))}" data-n-taxa><span>/h</span></label>
        <div class="stepper st-sm">
          <button type="button" class="st-btn" data-passo="-1" aria-label="${esc(C.menosNivel(n.nome))}">−</button>
          <input type="number" inputmode="numeric" min="0" max="300" value="${n.qtd}" aria-label="${esc(C.pessoasNivel(n.nome))}" data-n-qtd>
          <button type="button" class="st-btn" data-passo="1" aria-label="${esc(C.maisNivel(n.nome))}">+</button>
        </div>
        <button type="button" class="n-rm" data-n-rm aria-label="${esc(C.removerNivel(n.nome))}"${st.niveis.length === 1 ? ' disabled' : ''}>×</button>
      </div>`).join('');
  }

  function atualizar(){
    const v = valores(), p = v.pessoas, oc = OCORRENCIAS[st.freq];
    el.querySelectorAll('[data-simbolo]').forEach(s => { s.textContent = simboloMoeda(st.moeda); });
    odometro(fmtNum(v.custo));
    q('[data-sr]').textContent = C.sr(fmtMoeda(v.custo, st.moeda));
    q('[data-detalhe]').textContent = st.modo === 'rapido'
      ? C.detalheRapido(p, st.duracao, fmtMoeda(st.taxa, st.moeda))
      : C.detalheNiveis(st.niveis.filter(n => n.qtd > 0).map(n => `${n.qtd} ${n.nome}`).join(' + ') || C.ninguem, st.duracao);
    q('[data-rapido]').hidden = st.modo !== 'rapido';
    q('[data-detalhado]').hidden = st.modo !== 'detalhado';
    q('[data-total-niveis]').textContent = C.total(somaNiveis());
    q('[data-dur]').style.setProperty('--p', (st.duracao - 5) / (120 - 5) * 100 + '%');
    q('[data-dur-out]').textContent = `${st.duracao} min`;
    el.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.preset === st.duracao)));
    q('[data-anual]').hidden = !st.recorrente;
    q('[data-freqs]').hidden = !st.recorrente;
    if (st.recorrente){
      q('[data-mes]').textContent = fmtMoeda(v.custoAno / 12, st.moeda);
      q('[data-ano]').textContent = fmtMoeda(v.custoAno, st.moeda);
      q('[data-horas]').textContent = fmtNum(p * st.duracao / 60 * oc) + ' h';
      q('[data-anual-nota]').textContent = C.base(T.opcoes.freq[st.freq], C.ocTxt[st.freq]);
    }
    avisar(v);
  }

  el.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('[data-dur]')) st.duracao = +t.value;
    else if (t.matches('[data-pessoas]')){ const v = parseInt(t.value, 10); if (Number.isFinite(v) && v >= 1) st.pessoas = Math.min(300, v); }
    else if (t.matches('[data-taxa]')){ const v = parseFloat(t.value); if (Number.isFinite(v) && v >= 0){ st.taxa = v; salvar(); } }
    else if (t.closest('.nivel')){
      const n = st.niveis[+t.closest('.nivel').dataset.i];
      if (t.matches('[data-n-nome]')){ n.nome = t.value.slice(0, 24); salvar(); }
      if (t.matches('[data-n-taxa]')){ const v = parseFloat(t.value); if (Number.isFinite(v) && v >= 0){ n.taxa = v; salvar(); } }
      if (t.matches('[data-n-qtd]')){ const v = parseInt(t.value, 10); n.qtd = Number.isFinite(v) && v >= 0 ? Math.min(300, v) : 0; }
    } else return;
    atualizar();
  });
  el.addEventListener('change', e => {
    const t = e.target;
    if (t.name === `${id}-modo`){
      st.modo = t.value;
      if (st.modo === 'detalhado' && somaNiveis() === 0) st.niveis[0].qtd = st.pessoas;
      if (st.modo === 'detalhado') renderNiveis();
      if (st.modo === 'rapido' && somaNiveis() > 0){ st.pessoas = somaNiveis(); q('[data-pessoas]').value = st.pessoas; }
      salvar();
    } else if (t.name === `${id}-freq`){ st.freq = t.value; salvar(); }
    else if (t.matches('[data-moeda]')){ st.moeda = t.value; salvar(); }
    else if (t.matches('[data-recorrente]')) st.recorrente = t.checked;
    else if (t.matches('[data-pessoas]')) t.value = st.pessoas;
    else if (t.matches('[data-taxa]')) t.value = st.taxa;
    else return;
    atualizar();
  });
  el.addEventListener('click', e => {
    const preset = e.target.closest('[data-preset]');
    if (preset){ st.duracao = +preset.dataset.preset; q('[data-dur]').value = Math.min(120, st.duracao); atualizar(); return; }
    if (e.target.closest('[data-add-nivel]')){
      st.niveis.push({nome:C.nivelNovo(st.niveis.length + 1), taxa:100, qtd:0});
      renderNiveis(); salvar(); atualizar();
      const nomes = el.querySelectorAll('[data-n-nome]'); nomes[nomes.length - 1].select();
      return;
    }
    const rm = e.target.closest('[data-n-rm]');
    if (rm && st.niveis.length > 1){ st.niveis.splice(+rm.closest('.nivel').dataset.i, 1); renderNiveis(); salvar(); atualizar(); return; }
    if (e.target.closest('[data-compartilhar]')){
      copiar(urlBase() + '#cfg=' + codificarConfig(st), location.protocol === 'file:' ? T.ui.res.linkLocal : C.compartilharCopiado);
      return;
    }
    if (e.target.closest('[data-copiar-convite]')){
      const v = valores();
      let txt = C.convite(fmtMoeda(v.custo, st.moeda), v.pessoas, st.duracao);
      if (st.recorrente) txt += C.conviteAnual(T.opcoes.freq[st.freq], fmtMoeda(v.custoAno / 12, st.moeda), fmtMoeda(v.custoAno, st.moeda));
      copiar(txt, C.custoCopiado);
    }
  });

  renderNiveis();
  atualizar();
}

function lerHistorico(){ const h = LS.ler(K_HIST, []); return Array.isArray(h) ? h.filter(e => e && e.id) : []; }

function salvarEntrada(r){
  const res = avaliar(r), h = lerHistorico();
  const base = {faixa:res.faixa, score:res.score, objetivo:r.objetivo, total:r.total, contribuem:r.contribuem, recorrente:r.recorrente === 'sim', duracao:res.duracao.min, respostas:r};
  const i = estado.entradaId ? h.findIndex(e => e.id === estado.entradaId) : -1;
  if (i >= 0){
    if (h[i].faixa !== base.faixa) Object.assign(h[i], {sentido:null, esperado:null});   // recomendação mudou: avaliação antiga não vale
    Object.assign(h[i], base);
  } else {
    estado.entradaId = novoId();
    h.unshift({id:estado.entradaId, ts:Date.now(), ...base, custo:null, custoAno:null, moeda:null, seguiu:null, sentido:null, esperado:null});
  }
  gravarHistorico(h);
}
function atualizarCustoEntrada(v){
  if (!estado.entradaId) return;
  const h = lerHistorico(), e = h.find(x => x.id === estado.entradaId);
  if (!e) return;
  Object.assign(e, {custo:Math.round(v.custo), custoAno:v.custoAno === null ? null : Math.round(v.custoAno), moeda:v.moeda, duracaoCalc:v.duracao});
  gravarHistorico(h);
}

      <div class="kpi"><span class="t-rot">${H.kEvitado}</span><span class="t-val">${fmtMoeda(evitado, moeda)}</span><span class="t-sub">${H.naoMarcadas(evitadas.length)}</span></div>

    <section style="margin-top:28px">

          <tbody>${F.map(a => `<tr><th>${T.faixas[a].curto}</th>${F.map(b => `<td class="${a === b ? 'diag' : mat[a][b] ? 'fora' : ''}">${mat[a][b]}</td>`).join('')}</tr>`).join('')}</tbody></table>
        <p class="muted" style="font-size:14px">${dicaCalib || (discord ? '' : H.calibVazio)}</p></div>` : `<p class="nota">${H.calibVazio}</p>`}
    </section>
    <div class="tabela-wrap" style="margin-top:24px"><table class="tabela">
      <thead><tr><th>${H.col.data}</th><th>${H.col.resultado}</th><th>${H.col.objetivo}</th><th class="num">${H.col.pessoas}</th><th class="num">${H.col.score}</th><th class="num">${H.col.custo}</th><th>${H.col.seguiu}</th><th>${H.col.sentido}</th></tr></thead>
      <tbody>${h.map(e => `
        <tr data-id="${esc(e.id)}">

    return [df.format(e.ts), T.faixas[e.faixa] ? T.faixas[e.faixa].rotulo : e.faixa, e.score, op('objetivo', r.objetivo || e.objetivo), op('info', r.info), op('discordancia', r.discordancia),
      e.total, e.contribuem, op('urgencia', r.urgencia), e.recorrente ? H.sim : H.nao, op('pautaNova', r.pautaNova), op('abstracao', r.abstracao),
      e.duracao, e.custo ?? '', e.custoAno ?? '', sn(e.seguiu), sn(e.sentido), e.esperado && T.faixas[e.esperado] ? T.faixas[e.esperado].rotulo : ''];
  })];
  baixar(H.arquivo, '﻿' + gerarCSV(linhas, T.csvSep), 'text/csv;charset=utf-8');
}
$('#tela-historico').addEventListener('click', e => {
  const b = e.target.closest('[data-seguiu],[data-sentido],[data-h]');
  if (!b) return;
  if (b.dataset.h === 'exportar') return exportarHistorico();
  if (b.dataset.h === 'limpar'){ $('[data-confirmar]').hidden = false; b.hidden = true; return; }
  if (b.dataset.h === 'limpar-nao') return renderHistorico();
  if (b.dataset.h === 'limpar-sim'){ gravarHistorico([]); estado.entradaId = null; renderHistorico(); renderTopo(); toast(T.ui.hist.apagado); return; }
  const campo = b.dataset.seguiu ? 'seguiu' : 'sentido', valor = (b.dataset.seguiu || b.dataset.sentido) === 'sim';
  const id = b.closest('tr').dataset.id, h = lerHistorico(), entrada = h.find(x => x.id === id);
  if (!entrada) return;
  entrada[campo] = entrada[campo] === valor ? null : valor;   // clicar de novo desmarca
  if (campo === 'sentido' && entrada.sentido !== false) entrada.esperado = null;
  gravarHistorico(h);
  renderHistorico();
  const mesmo = $(`#tela-historico tr[data-id="${CSS.escape(id)}"] [data-${campo}="${valor ? 'sim' : 'nao'}"]`);
  if (mesmo) mesmo.focus();
});
$('#tela-historico').addEventListener('change', e => {
  if (!e.target.matches('[data-esperado]')) return;
  const id = e.target.closest('tr').dataset.id, h = lerHistorico(), entrada = h.find(x => x.id === id);
  if (!entrada) return;
  entrada.esperado = e.target.value || null;
  gravarHistorico(h);
  renderHistorico();
  const sel = $(`#tela-historico tr[data-id="${CSS.escape(id)}"] [data-esperado]`);
  if (sel) sel.focus();
});
